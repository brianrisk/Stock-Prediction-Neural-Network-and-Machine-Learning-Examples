[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-prediction-examples"
version = "0.2.0"
description = "Educational stock-classification examples using common ML frameworks"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10,<2",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.13,<3"]
torch = ["torch>=2,<3", "pytorch-lightning>=2,<3"]
all = [
    "tensorflow>=2.13,<3",
    "torch>=2,<3",
    "pytorch-lightning>=2,<3",
]
dev = ["ruff>=0.5,<1"]

[tool.setuptools]
py-modules = ["common", "data_utils", "evaluation", "reproducibility", "validation"]

[tool.setuptools.packages.find]
include = ["simple_examples*", "hyperparameter_tuning*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_hyper_main.py" = ["E402"]
