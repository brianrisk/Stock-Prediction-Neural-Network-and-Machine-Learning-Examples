name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: ruff check common.py data_utils.py evaluation.py reproducibility.py validation.py tests
